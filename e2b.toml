# E2B Sandbox Template Configuration
# https://e2b.dev/docs/sandbox-template

# Template name - used as identifier when spawning sandboxes
template_name = "critique-sandbox"

# Dockerfile to use for building the template
dockerfile = "e2b.Dockerfile"

# Start command (optional) - runs when sandbox starts
# start_cmd = ""

# Template description
[metadata]
description = "Sandbox with Bun and critique for rendering GitHub diffs"
